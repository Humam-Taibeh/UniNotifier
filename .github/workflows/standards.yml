name: Standards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  standards:
    name: Project standards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Humam-Taibeh/project-standards@797d5625a934f34145148a2597e0fa1aaf06a6ad
