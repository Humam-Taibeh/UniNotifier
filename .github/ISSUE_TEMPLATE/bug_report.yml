name: Bug report
description: Something doesn't work the way the README says.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **This page is public.** Never paste your `.env`, a password, your student ID, your Telegram bot
        token, a healthchecks.io URL or cookies. Your Windows user name appears in file paths — replace it
        with `you` if you prefer.

        Found a way to read someone's credentials or make the bot act for a stranger? Please don't open an
        issue — report it privately as described in [SECURITY.md](https://github.com/Humam-Taibeh/UniNotifier/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: |
        Run `.venv\Scripts\python -m uninotifier.doctor --offline` in the project folder and paste the result.
        It never prints passwords or tokens, but read it before posting.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log lines around the problem (optional)
      description: |
        From `data\logs\monitor.log` or `data\logs\bot.log` — only the lines around the problem.
        Secrets are masked in the logs, but course names and file paths are not: remove what you'd rather keep private.
      render: text

  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: UniNotifier version
      description: The release you installed, or the output of `git log -1 --format=%h`.
      placeholder: v1.0.1

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have verified that no passwords, student IDs, or private tokens are included.
          required: true
