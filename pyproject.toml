[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uninotifier"
version = "1.0.1"
description = "Telegram assistant for Al-Zaytoonah University students: Moodle monitoring, reminders, grades and GPA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-docx>=1.1",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pyflakes>=3.0", "pylint>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
