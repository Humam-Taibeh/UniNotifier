<!-- UniNotifier's own icon (not the university's logo). Drawn to docs/images/uninotifier-icon.png at 1024 px. -->
<svg width="1024" height="1024" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14703f"/>
      <stop offset="1" stop-color="#0a4a2a"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3efe7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#04251a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <circle cx="50" cy="52" r="34" fill="#ffffff" opacity="0.06"/>
  <g filter="url(#shadow)">
    <!-- the bell -->
    <path d="M50 31c-10 0-16.5 7.8-16.5 18.5v8.2c0 2.2-.8 4.4-2.2 6.1l-3.3 4c-1 1.3-.1 3.2 1.6 3.2h40.8c1.7 0 2.6-1.9 1.6-3.2l-3.3-4c-1.4-1.7-2.2-3.9-2.2-6.1v-8.2C66.5 38.8 60 31 50 31z" fill="url(#bell)"/>
    <path d="M44.2 73.8a5.8 5.8 0 0 0 11.6 0z" fill="url(#bell)"/>
    <!-- the graduation cap on top of it -->
    <path d="M50 15.5 72 24 50 32.5 28 24z" fill="#0f2c1e"/>
    <path d="M38 27.6v5.2c0 2.6 5.4 4.8 12 4.8s12-2.2 12-4.8v-5.2L50 32.5z" fill="#0f2c1e"/>
    <path d="M71 24.4v9.8" stroke="#f2b632" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="71" cy="35.4" r="2" fill="#f2b632"/>
  </g>
  <!-- the new-message dot -->
  <circle cx="69.5" cy="61.5" r="6.4" fill="#f2b632" stroke="#0d5a33" stroke-width="2.4"/>
</svg>
